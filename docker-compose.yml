# Base compose for running the service from a clone of this repo.
#   docker compose up -d --build
# Starts the queue manager + shared generation worker + API (8890) + WebUI
# (7865), all inside one container (see launch.py).
#
# The maintainer's own machine does NOT deploy from here: the live deployment
# lives in ~/Fooosti (data/ + docker-compose.yml, build context = this repo).
#
# Useful flags (CMDARGS):  --only-api / --only-webui
#   --api-port 8890 (API)  --webui-port 7865  --listen 127.0.0.1|0.0.0.0
volumes:
  fooocus-data:

services:
  app:
    build: .
    image: fooosti:latest
    # host network: CMDARGS binds loopback, so 7865/8890 are reachable on the
    # host (bridge ports + loopback bind would make both unreachable)
    network_mode: host
    environment:
      - CMDARGS=--api-port 8890 --listen 127.0.0.1   # Arguments for launch.py.
      - DATADIR=/content/data   # Directory which stores models, outputs dir
      - config_path=/content/data/config.txt
      - config_example_path=/content/data/config_modification_tutorial.txt
      - path_checkpoints=/content/data/models/checkpoints/
      - path_loras=/content/data/models/loras/
      - path_embeddings=/content/data/models/embeddings/
      - path_vae_approx=/content/data/models/vae_approx/
      - path_upscale_models=/content/data/models/upscale_models/
      - path_inpaint=/content/data/models/inpaint/
      - path_controlnet=/content/data/models/controlnet/
      - path_clip_vision=/content/data/models/clip_vision/
      - path_fooocus_expansion=/content/data/models/prompt_expansion/fooocus_expansion/
      - path_prompt_translator=/content/data/models/prompt_translator/
      - path_outputs=/content/app/outputs/    # Warning: If it is not located under '/content/app', you can't see history log!
    volumes:
      - fooocus-data:/content/data
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [compute, utility]
